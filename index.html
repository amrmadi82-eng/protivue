<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ProtiVue</title>
<meta name="description" content="ProtiVue — تحليل الوجبات بالصور ومتابعة البروتين والسعرات">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E6B4B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ProtiVue">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=Readex+Pro:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one-column mobile app shell, sticky top bar, bottom tab bar, full-screen sheets for capture/review */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#E3E8EE; --fg:#111821; --muted:#5A6573; --line:#D3DAE3;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#DCE5FB;
  --prot:#D94A33; --carb:#C98A12; --fat:#16897A;
  --good:#24804F; --warn:#B86A10; --bad:#C2342D;
  --good-soft:#DCEFE3; --warn-soft:#F7E9D3; --bad-soft:#F6DCDA;
  --shadow:0 1px 2px rgba(17,24,33,.06),0 6px 20px rgba(17,24,33,.06);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1016; --surface:#141A22; --surface-2:#1C2430; --fg:#E7ECF2; --muted:#93A0B0; --line:#273141;
  --accent:#6189FF; --accent-ink:#0A0F1A; --accent-soft:#1A2848;
  --prot:#FF6E55; --carb:#F0B23A; --fat:#3BC3AE;
  --good:#4CC384; --warn:#E9A24A; --bad:#FF7468;
  --good-soft:#15301F; --warn-soft:#33260F; --bad-soft:#3A1918;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1016; --surface:#141A22; --surface-2:#1C2430; --fg:#E7ECF2; --muted:#93A0B0; --line:#273141;
  --accent:#6189FF; --accent-ink:#0A0F1A; --accent-soft:#1A2848;
  --prot:#FF6E55; --carb:#F0B23A; --fat:#3BC3AE;
  --good:#4CC384; --warn:#E9A24A; --bad:#FF7468;
  --good-soft:#15301F; --warn-soft:#33260F; --bad-soft:#3A1918;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:600}
h2{font-size:18px}
h3{font-size:15px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:6px}
.brand i{font-style:normal;width:9px;height:9px;border-radius:2px;background:var(--prot);display:inline-block;transform:rotate(45deg)}
.top .sp{flex:1}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-block:4px 14px}
.datebar button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.datebar button:disabled{opacity:.35;cursor:default}
.datebar .d{font-family:var(--f-display);font-weight:500;text-align:center}

.notice{border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start;margin-block:0 12px}
.notice.warn{background:var(--warn-soft);color:var(--fg)}
.notice.bad{background:var(--bad-soft)}
.notice.info{background:var(--accent-soft)}
.notice b{font-weight:600}

/* summary panel */
.panel{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.rings{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;align-items:center}
.ring{position:relative;display:grid;place-items:center}
.ring svg{width:100%;max-width:170px;height:auto;display:block}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.ring .lbl{font-size:12px;color:var(--muted)}
.ring.sm .big{font-size:20px}
.ring.sm svg{max-width:120px}
.bars{display:grid;gap:12px;margin-top:16px}
.bar .row{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.bar .row b{font-weight:600}
.track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.track span{display:block;height:100%;border-radius:99px}
.extras{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.extras div{text-align:center;min-width:0}
.extras .v{font-family:var(--f-display);font-size:15px;font-variant-numeric:tabular-nums}
.extras .k{font-size:11.5px;color:var(--muted)}
.over{color:var(--bad)}

/* capture */
.cta{margin-block:16px 8px;display:grid;gap:10px}
.shoot{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);padding:18px;font-family:var(--f-display);font-size:19px;font-weight:600;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 30%,transparent)}
.shoot svg{width:26px;height:26px}
.shoot:active{transform:translateY(1px)}
.alt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-weight:500;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}

/* meal list */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-block:22px 10px}
.meals{display:grid;gap:10px}
.cat-h{font-size:12px;letter-spacing:.04em;color:var(--muted);margin-block:6px 0;display:flex;justify-content:space-between}
.meal{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:10px;border:1px solid transparent;text-align:start;width:100%}
.meal:hover{border-color:var(--line)}
.thumb{width:56px;height:56px;border-radius:10px;background:var(--surface-2);object-fit:cover;display:grid;place-items:center;color:var(--muted);font-size:20px;overflow:hidden}
.meal .t{min-width:0}
.meal .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal .m{font-size:12.5px;color:var(--muted)}
.meal .k{text-align:end;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.meal .k small{display:block;font-size:11.5px;color:var(--prot);font-family:var(--f-body)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:9px 4px 10px;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .in{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
.sheet .hd{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;z-index:2}
.sheet .hd h2{flex:1}
.x{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.photo{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;background:var(--surface-2);display:block}
.scan{position:relative;overflow:hidden;border-radius:16px}
.scan::after{content:"";position:absolute;inset-inline:0;height:30%;top:-30%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent) 35%,transparent),transparent);animation:scan 1.6s linear infinite}
@keyframes scan{to{top:100%}}
@media (prefers-reduced-motion:reduce){.scan::after{animation:none;display:none}}
.status{display:flex;gap:10px;align-items:center;margin-block:14px;font-weight:500}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

.conf{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600}
.conf.high{background:var(--good-soft);color:var(--good)}
.conf.medium{background:var(--warn-soft);color:var(--warn)}
.conf.low{background:var(--bad-soft);color:var(--bad)}
.estimate{background:var(--surface);border-radius:16px;padding:14px;margin-block:14px;display:grid;gap:8px;box-shadow:var(--shadow)}
.estimate .kc{font-family:var(--f-display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.estimate .rg{font-size:13px;color:var(--muted)}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mac div{background:var(--surface-2);border-radius:10px;padding:8px;text-align:center}
.mac .v{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums}
.mac .k{font-size:11.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:4px}

.items{display:grid;gap:10px}
.item{background:var(--surface);border-radius:var(--r);padding:12px;display:grid;gap:8px;border:1px solid var(--line)}
.item.bad{border-color:var(--bad)}
.item .r1{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.item .nm{font-weight:600;min-width:0}
.item .src{font-size:12px;color:var(--muted)}
.item .src.miss{color:var(--bad);font-weight:600}
.item .r2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gin{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.gin button{border:0;background:var(--surface-2);width:34px;height:36px;font-size:17px}
.gin input{width:64px;border:0;text-align:center;height:36px;background:transparent;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.item .vals{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .note{font-size:12.5px;color:var(--muted)}
.link{border:0;background:none;color:var(--accent);padding:4px 2px;font-size:13px;font-weight:500}
.link.danger{color:var(--bad)}
.manual{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.manual label{font-size:11px;color:var(--muted);display:grid;gap:2px}
.manual input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--surface);min-width:0}

.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--surface);width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:grid;gap:12px}
.q{background:var(--accent-soft);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.q h3{font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.footbar{position:fixed;inset-inline:0;bottom:0;z-index:21;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.footbar .in2{max-width:528px;margin:0 auto;display:flex;gap:10px}
.footbar .btn{flex:1}

.search{position:relative}
.results{display:grid;gap:4px;margin-top:6px;max-height:260px;overflow:auto}
.results button{display:flex;justify-content:space-between;gap:8px;text-align:start;border:0;background:var(--surface);border-radius:10px;padding:9px 10px;font-size:14px}
.results button span:last-child{color:var(--muted);font-size:12px;white-space:nowrap}

/* report & progress */
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv .num{text-align:end}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
table.t td.n,table.t th.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
.tips{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.tips li{background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14px;border-inline-start:3px solid var(--accent)}
.tips li.w{border-inline-start-color:var(--warn)}
.tips li.g{border-inline-start-color:var(--good)}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:600}
.pill.g{background:var(--good-soft);color:var(--good)}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.pill.b{background:var(--bad-soft);color:var(--bad)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface);border-radius:12px;padding:10px;text-align:center;min-width:0}
.stats .v{font-family:var(--f-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stats .k{font-size:11.5px;color:var(--muted)}
.mt{margin-top:14px}.mt2{margin-top:22px}
.row-b{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;inset-inline:16px;bottom:86px;z-index:40;margin:0 auto;max-width:420px;background:var(--fg);color:var(--bg);border-radius:12px;padding:11px 14px;font-size:14px;text-align:center;box-shadow:var(--shadow)}
.confirm{background:var(--bad-soft);border-radius:12px;padding:12px;display:grid;gap:10px}
.histrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}

/* ===== app shell layer ===== */
:root{--hero:#111821;--hero-fg:#F2F5F9;--hero-muted:#98A4B4;--hero-track:#27313F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hero:#1B2432;--hero-fg:#F2F5F9;--hero-muted:#98A4B4;--hero-track:#2C3747}}
:root[data-theme="dark"]{--hero:#1B2432;--hero-fg:#F2F5F9;--hero-muted:#98A4B4;--hero-track:#2C3747}
html{-webkit-tap-highlight-color:transparent}
body{overscroll-behavior-y:none}
button{-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:transform .12s ease}
button:active:not(:disabled){transform:scale(.96)}
.app{padding-block:0 128px}
.top{padding-block:14px 10px}
.hello{display:grid;line-height:1.25;min-width:0}
.hello small{color:var(--muted);font-size:13px}
.hello b{font-family:var(--f-display);font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:42px;height:42px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;border:0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-block:4px 14px}
.week button{border:0;background:var(--surface);border-radius:14px;padding:8px 0 7px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);min-width:0}
.week button b{font-family:var(--f-display);font-size:17px;color:var(--fg);font-weight:600;line-height:1.2}
.week button i{width:5px;height:5px;border-radius:50%;background:transparent}
.week button i.on{background:var(--prot)}
.week button[aria-current="date"]{background:var(--fg);color:var(--bg)}
.week button[aria-current="date"] b{color:var(--bg)}
.hero{background:var(--hero);color:var(--hero-fg);border-radius:24px;padding:18px 16px;box-shadow:0 10px 30px rgba(17,24,33,.18);--ring-track:var(--hero-track)}
.hero .lbl,.hero .extras .k,.hero .row span{color:var(--hero-muted)}
.hero .row b,.hero .extras .v{color:var(--hero-fg)}
.hero .track{background:var(--hero-track)}
.hero .extras{border-top-color:var(--hero-track)}
.hero .over,.hero .row b.over,.hero .extras .v.over{color:#FF8A7A}
.hero-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;color:var(--hero-muted)}
.hero-h b{color:var(--hero-fg);font-family:var(--f-display);font-weight:500;font-size:14px}
.panel,.meal,.stats div,.tips li{border-radius:18px}
.shoot{border-radius:20px;padding:20px}
.btn{border-radius:14px}
.tabs{inset-inline:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-bottom:0;border:1px solid var(--line);border-radius:24px;max-width:536px;margin:0 auto;box-shadow:0 10px 30px rgba(17,24,33,.14)}
.tabs nav{grid-template-columns:repeat(5,1fr);align-items:end}
.tabs button{padding:9px 2px 8px}
.tabs .fab{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);margin:-26px auto 6px;padding:0;display:grid;place-items:center;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 45%,transparent);border:4px solid var(--bg)}
.tabs .fab svg{width:26px;height:26px}
.sheet.enter{animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet.enter{animation:none}button{transition:none}}
.toast{bottom:104px}
.picker{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px}
.picker select:disabled,.picker input:disabled{opacity:.5}
.page-h{font-family:var(--f-display);font-size:24px;font-weight:600;margin-block:4px 14px}

/* ===== ProtiVue visual system v2 (light, deep green) ===== */
:root{--bg:#F6F6F2;--surface:#FFFFFF;--surface-2:#EFF1EC;--fg:#15211B;--muted:#68746D;--line:#E4E7E1;--accent:#1E6B4B;--accent-ink:#FFFFFF;--accent-soft:#E2EFE7;--bar-soft:#CFE5D8;--prot:#23845A;--carb:#E2A033;--fat:#3D8BDA;--hero-track:#E6EEE9;--shadow:0 1px 2px rgba(21,33,27,.04),0 4px 14px rgba(21,33,27,.05);--f-display:"Plus Jakarta Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1310;--surface:#151D19;--surface-2:#1C2621;--fg:#E8EEEA;--muted:#9AA8A0;--line:#25312B;--accent:#4DB886;--accent-ink:#06120C;--accent-soft:#17301F;--bar-soft:#24402F;--prot:#4DB886;--carb:#F0B550;--fat:#5EA8F2;--hero-track:#24302A;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1310;--surface:#151D19;--surface-2:#1C2621;--fg:#E8EEEA;--muted:#9AA8A0;--line:#25312B;--accent:#4DB886;--accent-ink:#06120C;--accent-soft:#17301F;--bar-soft:#24402F;--prot:#4DB886;--carb:#F0B550;--fat:#5EA8F2;--hero-track:#24302A;--shadow:none;color-scheme:dark}
.top{padding-block:14px 4px}
.brand2{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-style:italic;font-weight:800;font-size:26px;color:var(--accent);letter-spacing:-.02em;direction:ltr}
.avatar{width:38px;height:38px;font-size:15px}
.ttl{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-block:6px 16px}
.ttl h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.ttl .sub{color:var(--muted);font-size:14px;margin-top:3px}
.icon-btn{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg);flex:none;cursor:pointer;overflow:hidden}
.icon-btn svg{width:20px;height:20px}
.icon-btn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.kc{display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(0,1fr);align-items:center;gap:14px}
.vdiv{width:1px;align-self:stretch;margin-block:18px;background:var(--line)}
.kc .ring>svg{max-width:168px}
.kc .ring .c svg{width:20px;height:20px;max-width:20px;color:var(--accent);margin:0 auto 2px;display:block}
.kc .big{font-size:30px;font-weight:700;color:var(--fg)}
.kc .lbl{color:var(--muted);font-size:12.5px}
.kc-r .big2{font-family:var(--f-display);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kc-r .lbl{color:var(--muted);font-size:14px;margin-top:2px}
.macs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.mac2{padding:12px;border-radius:16px;display:grid;gap:6px;min-width:0}
.mh{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;min-width:0}
.mi{flex:none}.mi svg{width:16px;height:16px;display:block}
.mv{font-family:var(--f-display);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mv b{font-size:19px;color:var(--fg);font-weight:700}
.mac2 .track{height:6px;margin-top:2px;background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12px;color:var(--muted)}
.chips b{color:var(--fg);font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums}
.acts{display:grid;gap:8px;margin-block:14px}
.acts .shoot{padding:15px;font-size:17px;border-radius:16px;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 28%,transparent)}
.alt3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.alt3 .btn{padding:9px 6px;font-size:13px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.ch h2{font-size:18px;font-weight:700}
.ch .num{font-size:14px;color:var(--fg);font-weight:500}
.mlist{display:grid}
.mrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto 16px;gap:12px;align-items:center;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:start;width:100%;color:inherit}
.mrow:first-child{border-top:0}
.mth{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.mth svg{width:26px;height:26px}
.mt{display:grid;gap:1px;min-width:0}
.mn{font-weight:700;font-size:15px}
.mn .tm{font-weight:400;color:var(--muted);font-size:12px;margin-inline-start:4px}
.md{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk{font-family:var(--f-display);font-weight:700;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{color:var(--muted)}.chev svg{width:16px;height:16px;display:block}
[dir="rtl"] .chev svg,[dir="rtl"] .lnk svg{transform:scaleX(-1)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:160px;margin-top:12px}
.wk button{border:0;background:none;padding:0;display:grid;grid-template-rows:1fr auto;height:100%;gap:4px;justify-items:center;min-width:0;color:inherit}
.wk .v{font-size:10.5px;color:var(--muted);font-family:var(--f-display);font-variant-numeric:tabular-nums}
.wk .bw{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;min-height:0}
.wk .b{width:78%;border-radius:6px 6px 3px 3px;background:var(--bar-soft);min-height:3px}
.wk button[aria-current="date"] .b{background:var(--accent)}
.wk button[aria-current="date"] .v{color:var(--fg);font-weight:600}
.wk .d{font-size:11px;color:var(--muted);line-height:1.25;text-align:center}
.wk .d b{display:block;color:var(--fg);font-weight:600;font-size:12px}
.lnk{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:0;display:inline-flex;gap:4px;align-items:center}
.lnk svg{width:16px;height:16px}
.mt12{margin-top:12px}
.tabs{inset-inline:0;bottom:0;border-radius:0;max-width:none;margin:0;border:0;border-top:1px solid var(--line);background:var(--surface);box-shadow:none;backdrop-filter:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:560px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs .fab{background:var(--accent);color:var(--accent-ink);border-color:var(--surface);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent)}
.panel{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px}
.shoot{background:var(--accent)}
.toast{bottom:96px}
@media (max-width:370px){.kc{grid-template-columns:1fr;justify-items:center}.vdiv{display:none}.kc-r{text-align:center}}

/* ===== Onboarding ===== */
.ob{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ob .in{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 132px;display:grid;gap:18px}
.ob-top{display:flex;align-items:center;gap:12px}
.ob-prog{flex:1;display:grid;gap:6px}
.ob-prog .bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.ob-prog .bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.ob-prog p{margin:0;font-size:13px;color:var(--muted);font-weight:600}
.ob h1{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.ob .lead{color:var(--muted);font-size:16px;margin:0;line-height:1.6}
.ob-hero{display:grid;justify-items:center;text-align:center;gap:16px;padding-block:7vh 8px}
.ob-hero img{width:104px;height:104px;border-radius:26px;box-shadow:0 12px 30px color-mix(in srgb,var(--accent) 25%,transparent)}
.ob-hero .brand2{font-size:32px}
.ob-feats{display:grid;gap:10px;margin:0;padding:0;list-style:none;text-align:start}
.ob-feats li{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:15px}
.ob-feats .fi{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ob-feats .fi svg{width:20px;height:20px}
.ob-foot{position:fixed;inset-inline:0;bottom:0;z-index:16;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.ob-foot .in3{max-width:488px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap}
.ob-foot .btn{flex:1;padding:15px;font-size:16px;font-weight:600;border-radius:14px}
.ob-foot .btn.primary{flex:2}
.ob-foot .ghost{flex-basis:100%;border:0;background:none;color:var(--accent);font-weight:600;padding:6px;font-size:15px}
.goal-grid{display:grid;gap:10px}
.goal{display:flex;gap:12px;align-items:center;text-align:start;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;color:inherit}
.goal[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.goal .gi{width:42px;height:42px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--accent)}
.goal[aria-checked="true"] .gi{background:var(--accent);color:var(--accent-ink)}
.goal .gi svg{width:22px;height:22px}
.goal b{display:block;font-size:16px}
.goal small{color:var(--muted);font-size:13px}
.ob .field input,.ob .field select{font-size:17px;padding:13px 14px;border-radius:12px;min-height:50px}
.ob .field label{font-size:14px;font-weight:600}
.ob .field .opt{font-weight:400;color:var(--muted)}
.ob .field input[aria-invalid="true"],.ob .field select[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.ob .err{color:var(--bad);font-size:13px;font-weight:500;min-height:0}
.ob .hint{color:var(--muted);font-size:12.5px}
.ob fieldset{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
.ob legend{font-size:14px;font-weight:600;padding:0;margin-bottom:8px}
.segs{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.segs button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;font-size:15px;font-weight:500;min-height:48px;color:inherit}
.segs button[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.segs.days{grid-template-columns:repeat(8,minmax(0,1fr))}
.segs.days button{padding:10px 0}
.ob-sum{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.ob-sum .k{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.ob-sum .k small{font-size:15px;font-weight:500;color:var(--muted)}
.ob-sum .m3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ob-sum .m3 div{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.ob-sum .m3 b{display:block;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.ob-sum .m3 span{font-size:12px;color:var(--muted)}
.ob-sum .note{font-size:13px;color:var(--muted);margin:0}
.ob-sum.empty{color:var(--muted);text-align:center;border-style:dashed;font-size:14px}
.ob-opts{display:grid;gap:10px}
.ob-opt{display:flex;gap:14px;align-items:center;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;color:inherit;min-height:72px}
.ob-opt.main{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ob-opt .oi{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ob-opt.main .oi{background:color-mix(in srgb,var(--accent-ink) 18%,transparent);color:var(--accent-ink)}
.ob-opt .oi svg{width:24px;height:24px}
.ob-opt b{display:block;font-size:17px}
.ob-opt small{font-size:13px;opacity:.8}
.ob-opt[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.ob h1:focus{outline:none}
.ob .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.ob-prog .bar span{transition:none}}

/* ===== Logo ===== */
.logo{display:flex;align-items:center;gap:8px;direction:ltr}
.logo .lm{height:34px;width:auto;flex:none}
.lw{font-family:"Comfortaa","Plus Jakarta Sans",system-ui,sans-serif;font-weight:700;font-size:25px;color:#1B8C89;letter-spacing:-.01em;line-height:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lw{color:#3CC0B6}}
:root[data-theme="dark"] .lw{color:#3CC0B6}
.ob-logo{display:grid;justify-items:center;gap:12px}
.ob-logo .lm{height:118px;width:auto;filter:drop-shadow(0 10px 22px rgba(27,140,137,.25))}
.ob-logo .lw{font-size:34px}
</style>

</head>

}

const S = {
  persist:false, cfg:{geminiKey:"",model:"gemini-3.6-flash",usdaKey:""}, usdaRes:[], imgOK:false, ready:false,
  profile:null, meals:[], foods:[], weights:[],

function allFoods(){ return FOODS.concat(S.foods.map(c=>({key:"c_"+c.id,ar:c.name,en:c.name,src:"custom",per:c.per}))) }
function foodByKey(k){ if(!k) return null; if(FOOD_BY_KEY[k]) return FOOD_BY_KEY[k]; if(k.startsWith("c_")){const c=S.foods.find(x=>"c_"+x.id===k); if(c) return {key:k,ar:c.name,en:c.name,src:"custom",per:c.per};} return null }

/* ============ targets ============ */
function calcTargets(p){
  if(!p||!p.age||!p.height||!p.weight||!p.sex) return null;
  const bmr = 10*p.weight + 6.25*p.height - 5*p.age + (p.sex==="male"?5:-161);
  const base = {sedentary:1.2,light:1.3,active:1.4}[p.activity||"sedentary"];
  const factor = Math.min(1.9, base + 0.05*(+p.trainDays||0));
  const tdee = bmr*factor;
  const goal = p.goal||"maintain";
  const kcal = tdee*(goal==="cut"?0.8:goal==="bulk"?1.1:1);
  const pk = goal==="cut"?2.2:goal==="bulk"?2.0:1.8;
  const prot = pk*p.weight;
  const fat = Math.max(0.6*p.weight, kcal*0.25/9);
  const carb = Math.max(0,(kcal - prot*4 - fat*9)/4);
  const calc = {bmr,tdee,factor,kcal,p:prot,c:carb,f:fat};
  const o = p.override||{};
  const use = p.useOverride ? {kcal:+o.kcal||kcal,p:+o.p||prot,c:+o.c||carb,f:+o.f||fat} : {kcal,p:prot,c:carb,f:fat};
  use.fib = Math.round(use.kcal/1000*14); use.na = 2300;
  return {calc,use};
}
function targets(){ const r=calcTargets(S.profile); return r?r.use:null }

/* ============ nutrition math ============ */
function itemPer(it){ if(it.key){const f=foodByKey(it.key); if(f) return f.per;} if(it.per) return it.per; return null }
function itemComplete(it){ const p=itemPer(it); return !!(p && [p.kcal,p.p,p.c,p.f].every(v=>v!=null&&v!==""&&!isNaN(+v))) }
function itemVals(it, grams){
  const p=itemPer(it); const g = grams==null?(+it.grams||0):grams; const o={};
  NUTS.forEach(k=>{ o[k] = (p && p[k]!=null && p[k]!=="" && !isNaN(+p[k])) ? (+p[k])*g/100 : null });
  return o;
}
function sumItems(items){
  const tot={partial:{}}; NUTS.forEach(k=>tot[k]=0);
  items.forEach(it=>{ if(!itemComplete(it)) return; const v=itemVals(it); NUTS.forEach(k=>{ if(v[k]==null) tot.partial[k]=true; else tot[k]+=v[k]; }) });
  return tot;
}
function dayMeals(k){ return S.meals.filter(m=>m.date===k).sort((a,b)=>a.ts-b.ts) }
function dayTotals(k){
  const tot={partial:{}}; NUTS.forEach(n=>tot[n]=0);
  dayMeals(k).forEach(m=>{ NUTS.forEach(n=>tot[n]+= (m.totals&&m.totals[n])||0); Object.assign(tot.partial,(m.totals&&m.totals.partial)||{}) });
  return tot;
}
function mealName(m){
  const names = (m.items||[]).filter(i=>!i.addedOil).map(i=> LANG==="ar"?(i.name_ar||i.name_en):(i.name_en||i.name_ar));
  return names.slice(0,3).join("، ") + (names.length>3?"…":"");
}

/* ============ persistence (IndexedDB on this device) ============ */
const IDB={db:null,
  open(){ return new Promise((res,rej)=>{ let r; try{ r=indexedDB.open("protivue",1);}catch(e){return rej(e)}
    r.onupgradeneeded=()=>{ const d=r.result; [["meals","id"],["photos","id"],["foods","id"],["weights","date"],["kv","k"]].forEach(([n,kp])=>{ if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:kp}); }); };
    r.onsuccess=()=>{ this.db=r.result; res(); }; r.onerror=()=>rej(r.error); }); },
  req(store,mode,fn){ return new Promise((res,rej)=>{ const tx=this.db.transaction(store,mode); const q=fn(tx.objectStore(store)); tx.oncomplete=()=>res(q?q.result:undefined); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); },
  all(s){ return this.req(s,"readonly",st=>st.getAll()); },
  get(s,k){ return this.req(s,"readonly",st=>st.get(k)); },
  put(s,v){ return this.req(s,"readwrite",st=>st.put(v)); },
  del(s,k){ return this.req(s,"readwrite",st=>st.delete(k)); },
  clear(s){ return this.req(s,"readwrite",st=>st.clear()); }
};
const P=()=>S.persist;
async function saveMeal(m, photoFull){
  if(P()){ if(photoFull) await IDB.put("photos",{id:m.id,data:photoFull}); await IDB.put("meals",m); }
  else if(photoFull) S.mem.photos[m.id]=photoFull;
  const i=S.meals.findIndex(x=>x.id===m.id); if(i>=0) S.meals[i]=m; else S.meals.push(m);
  renderAll();
}
async function deleteMeal(m){
  if(P()){ await IDB.del("meals",m.id); try{ await IDB.del("photos",m.id) }catch(e){} } else delete S.mem.photos[m.id];
  S.meals=S.meals.filter(x=>x.id!==m.id); renderAll();
}
async function getPhoto(id){ if(P()){ try{ const r=await IDB.get("photos",id); return r?r.data:null }catch(e){ return null } } return S.mem.photos[id]||null; }
async function saveProfile(p){ if(P()) await IDB.put("kv",{k:"profile",v:p}); S.profile=p; renderAll(); }
async function saveCfg(c){ S.cfg=Object.assign({},S.cfg,c); S.imgOK=!!S.cfg.geminiKey; if(P()) await IDB.put("kv",{k:"cfg",v:S.cfg}); renderAll(); }
async function saveCustom(c){ if(P()) await IDB.put("foods",c); S.foods.push(c); renderAll(); }
async function deleteCustom(id){ if(P()) await IDB.del("foods",id); S.foods=S.foods.filter(f=>f.id!==id); renderAll(); }
async function saveWeight(w){ if(P()) await IDB.put("weights",w); S.weights=S.weights.filter(x=>x.date!==w.date).concat(w); renderAll(); }
async function deleteWeight(d){ if(P()) await IDB.del("weights",d); S.weights=S.weights.filter(x=>x.date!==d); renderAll(); }
async function wipeAll(){
  if(P()){ for(const s of ["meals","photos","foods","weights","kv"]) await IDB.clear(s); }
  S.mem={photos:{}}; S.meals=[];S.foods=[];S.weights=[];S.profile=null; S.cfg={geminiKey:"",model:DEFAULT_MODEL,usdaKey:""}; S.imgOK=false; renderAll();
}
async function exportBackup(){
  const data={app:"ProtiVue",version:1,exportedAt:new Date().toISOString(),profile:S.profile,meals:S.meals,foods:S.foods,weights:S.weights,photos:P()?await IDB.all("photos"):Object.entries(S.mem.photos).map(([id,data])=>({id,data}))};
  await deliverFile(new Blob([JSON.stringify(data)],{type:"application/json"}),`protivue-backup-${todayKey()}.json`);
}
async function importBackup(file){
  const d=JSON.parse(await file.text()); if(!d||d.app!=="ProtiVue") throw new Error(LANG==="ar"?"ملف غير صالح":"Not a ProtiVue backup");
  for(const m of d.meals||[]){ if(P()) await IDB.put("meals",m); }
  for(const f of d.foods||[]){ if(P()) await IDB.put("foods",f); }
  for(const w of d.weights||[]){ if(P()) await IDB.put("weights",w); }
  for(const p of d.photos||[]){ if(P()) await IDB.put("photos",p); else S.mem.photos[p.id]=p.data; }
  if(d.profile){ if(P()) await IDB.put("kv",{k:"profile",v:d.profile}); S.profile=d.profile; }
  const merge=(a,b,k)=>{ const m=new Map(a.map(x=>[x[k],x])); b.forEach(x=>m.set(x[k],x)); return [...m.values()]; };
  S.meals=merge(S.meals,d.meals||[],"id"); S.foods=merge(S.foods,d.foods||[],"id"); S.weights=merge(S.weights,d.weights||[],"date");
  renderAll();
}
async function deliverFile(blob,filename){
  try{ const f=new File([blob],filename,{type:blob.type}); if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:filename}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },3000);
}

/* ============ image utils ============ */
function loadImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>res({im,u}); im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("image"))}; im.src=u; }) }
function resize(im,max,q,asBlob){
  const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
  const c=document.createElement("canvas"); c.width=Math.round(im.naturalWidth*s); c.height=Math.round(im.naturalHeight*s);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  return asBlob ? new Promise(r=>c.toBlob(r,"image/jpeg",q)) : c.toDataURL("image/jpeg",q);
}
async function hashFile(file){
  try{ const buf=await file.arrayBuffer(); const h=await crypto.subtle.digest("SHA-256",buf); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("") }catch(e){ return null }
}

/* ============ analysis ============ */
function dbListForPrompt(){ return allFoods().map(f=>`${f.key} | ${f.en} | ${f.ar}`).join("\n") }
function buildPrompt(extra){
  return `You are an expert food-photo analyst for a nutrition tracker used by bodybuilders in the UAE. Meals are often Gulf/Emirati, Levantine, Egyptian, Indian or Western, home-cooked or restaurant.

const DEFAULT_MODEL="gemini-3.6-flash";
function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=()=>rej(r.error); r.readAsDataURL(blob); }); }
const FALLBACK_MODELS=["gemini-3.6-flash","gemini-3.5-flash-lite","gemini-3.8-flash","gemini-3.1-flash-lite"];
const NO_THINK=new Set();
function thinkCfg(model){ if(NO_THINK.has(model)) return null; if(/^gemini-3\.8/.test(model)) return {thinkingLevel:"low"}; if(/^gemini-3/.test(model)) return {thinkingLevel:"minimal"}; return null; }
const sleep=(ms,signal)=>new Promise((res,rej)=>{ const t0=setTimeout(res,ms); if(signal) signal.addEventListener("abort",()=>{clearTimeout(t0);rej(Object.assign(new Error("aborted"),{name:"AbortError"}))},{once:true}); });
async function geminiOnce(model,prompt,b64,mime,signal){
  const gc={responseMimeType:"application/json",temperature:0.2}; const tc=thinkCfg(model); if(tc) gc.thinkingConfig=tc;
  const ctl=new AbortController(); const onAb=()=>ctl.abort(); if(signal) signal.addEventListener("abort",onAb,{once:true});
  const timer=setTimeout(()=>ctl.abort(),40000);
  let r;
  try{
    r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{
      method:"POST",signal:ctl.signal,headers:{"Content-Type":"application/json","x-goog-api-key":S.cfg.geminiKey.trim()},
      body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt},{inline_data:{mime_type:mime,data:b64}}]}],generationConfig:gc})});
  }catch(e){ clearTimeout(timer); if(signal&&signal.aborted) throw e; const t2=new Error(LANG==="ar"?"انتهت المهلة":"Timed out"); t2.status=504; throw t2; }
  clearTimeout(timer); if(signal) signal.removeEventListener("abort",onAb);
  if(!r.ok){ let msg=""; try{ const j=await r.json(); msg=j.error&&j.error.message; }catch(_){}
    if(r.status===400 && tc && /think/i.test(msg)){ NO_THINK.add(model); return geminiOnce(model,prompt,b64,mime,signal); }
    const e=new Error(msg||("HTTP "+r.status)); e.status=r.status; throw e; }
  const j=await r.json();
  const txt=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("").trim();
  if(!txt){ const e=new Error(LANG==="ar"?"لم يرجع التحليل نتيجة":"Empty response"); e.status=502; throw e; }
  return JSON.parse(txt.replace(/^```(?:json)?\s*/,"").replace(/```\s*$/,""));
}
/* Tries the chosen model, retries briefly when Google's free servers are busy, then falls back to other free Flash models. */
async function geminiJSON(prompt,blob,signal,onStatus){
  const b64=await blobToB64(blob); const mime=blob.type||"image/jpeg";
  const chain=[...new Set([(S.cfg.model||DEFAULT_MODEL).trim(),...FALLBACK_MODELS])];
  let last;
  for(let m=0;m<chain.length;m++){
    for(let attempt=0;attempt<2;attempt++){
      try{
        if(onStatus && (m>0||attempt>0)) onStatus(LANG==="ar"?`الخادم مزدحم، أجرّب نموذجًا آخر (${m+1}/${chain.length})…`:`Server busy, trying another model (${m+1}/${chain.length})…`);
        return await geminiOnce(chain[m],prompt,b64,mime,signal);
      }catch(e){
        if(e.name==="AbortError") throw e;
        last=e;
        if(e.status===401||e.status===403) throw e;                        // key problem: no point retrying
        if(e.status===400 && /api key|API_KEY/i.test(e.message||"")) throw e;
        if(e instanceof SyntaxError) break;                                // bad JSON: try next model
        if((e.status===503||e.status===500||e.status===502) && attempt===0){ await sleep(1000,signal); continue; }
        break;                                                             // 429 / 404 / other: next model
      }
    }
  }
  throw last||new Error("Gemini");
}
function aiErrMsg(e){
  const ar=LANG==="ar";
  if(e&&(e.status===503||e.status===500||e.status===502)) return ar?" — خوادم Gemini المجانية مزدحمة الآن. اضغط «حاول مرة أخرى» بعد دقيقة، أو أدخل الوجبة يدويًا.":" — Gemini's free servers are busy right now. Tap 'Try again' in a minute, or enter the meal manually.";
  if(e&&e.status===429) return ar?" — تجاوزت الحد المجاني المؤقت لـGemini. انتظر دقيقة وحاول مرة أخرى، أو أدخل الوجبة يدويًا.":" — Gemini free-tier limit reached. Wait a minute and retry, or enter it manually.";
  if(e&&(e.status===400||e.status===401||e.status===403)) return (ar?" — تحقق من مفتاح Gemini واسم النموذج في الإعدادات. ":" — check your Gemini key and model name in Settings. ")+(e.message?`(${e.message})`:"");
  if(e&&e.status===404) return ar?" — اسم النموذج غير موجود. غيّره من الإعدادات.":" — model not found. Change it in Settings.";
  if(!navigator.onLine) return ar?" — لا يوجد اتصال بالإنترنت.":" — you're offline.";
  return e&&e.message?` (${e.message})`:"";
}
const NUT_IDS={kcal:[1008,2047,2048],p:[1003],c:[1005],f:[1004],sat:[1258],fib:[1079],sug:[2000,1063],na:[1093]};
const USDA_CACHE={};
try{ Object.assign(USDA_CACHE, JSON.parse(localStorage.getItem("protivue_usda")||"{}")); }catch(e){}
async function usdaSearchCached(q){
  const k=q.trim().toLowerCase(); if(USDA_CACHE[k]) return USDA_CACHE[k];
  const list=(await usdaSearch(k)).slice(0,6); USDA_CACHE[k]=list;
  try{ const keys=Object.keys(USDA_CACHE); if(keys.length>150) delete USDA_CACHE[keys[0]]; localStorage.setItem("protivue_usda",JSON.stringify(USDA_CACHE)); }catch(e){}

}
function validPer(o){ if(!o||typeof o!=="object") return null; const per={}; let ok=true;

  ["kcal","p","c","f"].forEach(k=>{ if(per[k]==null) ok=false; }); if(per.kcal>950) ok=false; return ok?per:null; }
/* For components not in the local table: try USDA first (real data), else fall back to Gemini's labelled estimate. */
async function resolveUnknown(items){
  const todo=items.filter(it=>!it.key && !it.addedOil && !it.usda && !it.manualPer);
  await Promise.all(todo.map(async it=>{
    const q=(it.usdaQ||it.name_en||"").trim(); if(!q) return;
    try{
      const list=await Promise.race([usdaSearchCached(q), new Promise((_,rej)=>setTimeout(()=>rej(new Error("t")),7000))]);
      if(list && list.length){ const top=list[0]; it.per=top.per; it.usda=top.fdcId; it.usdaName=top.name; it.estimated=false; it.cands=list; return; }
    }catch(e){}

}
async function usdaSearch(q){
  const key=(S.cfg.usdaKey||"").trim()||"DEMO_KEY";
  const u=`https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(key)}&query=${encodeURIComponent(q)}&dataType=${encodeURIComponent("Survey (FNDDS),SR Legacy,Foundation")}&pageSize=12`;

    const per={}; Object.entries(NUT_IDS).forEach(([k,ids])=>{ const id=ids.find(i=>n[i]!=null); per[k]= id!=null? +n[id] : null; });

function ringSVG(val,target,color,size){
  const r=44, C=2*Math.PI*r; const pct = target? Math.min(val/target,1):0; const over = target && val>target;

  <circle cx="50" cy="50" r="${r}" fill="none" stroke="${over?'var(--bad)':color}" stroke-width="${size}" stroke-linecap="round" stroke-dasharray="${(pct*C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 50 50)"/></svg>`;

function buildTips(k){
  const tg=targets(); const tot=dayTotals(k); const ms=dayMeals(k); const tips=[];
  if(!ms.length){ tips.push(["",t("tipEmpty")]); return tips; }
  if(!tg) return tips;
  const pLeft = tg.p - tot.p;
  if(pLeft>8){
    const ex = [["chicken_breast_grilled",31],["egg_white",10.9],["greek_yogurt_nonfat",10.2],["tuna_canned_water",25.5]]
      .slice(0,3).map(([key,pp])=>{const g=Math.round(pLeft/pp*100/10)*10; return `${g} ${t("g")} ${fname(FOOD_BY_KEY[key])} (${fmt(g*FOOD_BY_KEY[key].per.kcal/100)} ${t("kcal")})`});
    tips.push(["w",t("tipProt")(r0(pLeft), ex.join(LANG==="ar"?" أو ":" or "))]);
  } else tips.push(["g",t("tipProtDone")]);
  const kl = tg.kcal - tot.kcal;
  if(kl>150 && k===todayKey()) tips.push(["",t("tipKcalLeft")(r0(kl))]);
  if(kl < -tg.kcal*0.05) tips.push(["w",t("tipKcalOver")(r0(-kl))]);
  if(tot.f > tg.f*1.1) tips.push(["w",t("tipFat")(r0(tot.f-tg.f))]);
  if(tot.c < tg.c*0.6 && k!==todayKey()) tips.push(["",t("tipCarbLow")]);
  if(tot.fib < tg.fib*0.6 && (k!==todayKey() || new Date().getHours()>=18)) tips.push(["w",t("tipFib")(r0(tot.fib))]);
  if(tot.na>2300) tips.push(["w",t("tipNa")(fmt(tot.na))]);
  return tips;
}
function cmpRow(label,val,target,unit,partial,isLimit){
  let pill="";
  if(target){ const r=val/target;
    if(isLimit) pill = val<=target?`<span class="pill g">✓</span>`:`<span class="pill b">+${fmt(val-target)}</span>`;
    else pill = (r>=0.9&&r<=1.1)?`<span class="pill g">${esc(t("goalMet"))}</span>`: r<0.9?`<span class="pill w">−${fmt(target-val)}</span>`:`<span class="pill b">+${fmt(val-target)}</span>`;
  }
  return `<tr><td>${esc(label)}</td><td class="n">${partial?"≥":""}${unit===t("g")&&val<20?fmt1(val):fmt(val)} ${unit}</td><td class="n">${target?fmt(target)+" "+unit:"—"}</td><td class="n">${pill}</td></tr>`;
}

function daySeries(n){

function barChart(series,key,target,color,label){
  const W=340,H=150,pl=34,pr=6,pt=10,pb=22; const n=series.length;
  const max = Math.max(target||0, ...series.map(s=>s.tot[key]))*1.12 || 1;
  const bw=(W-pl-pr)/n; const y=(v)=>pt+(H-pt-pb)*(1-v/max);
  const ticks=[0,max/2,max].map(v=>Math.round(v/10)*10);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}" style="direction:ltr">`;
  ticks.forEach(v=>{ s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="0.6"/><text x="${pl-4}" y="${y(v)+3}" text-anchor="end">${v}</text>` });
  series.forEach((d,i)=>{ const v=d.tot[key]; const x=pl+i*bw+bw*0.18; const w=bw*0.64; const over= target && v>target*1.1;
    if(v>0) s+=`<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${w.toFixed(1)}" height="${(H-pb-y(v)).toFixed(1)}" rx="${Math.min(3,w/3)}" fill="${over?'var(--bad)':color}" opacity="${d.logged?1:0.3}"/>`;
    const step = n>10?5:1; if(i%step===0||i===n-1) s+=`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle">${d.k.slice(8)}</text>`;
  });
  if(target) s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(target)}" y2="${y(target)}" stroke="var(--fg)" stroke-width="1.2" stroke-dasharray="4 3"/>`;
  return s+`</svg>`;
}
function weightChart(ws){
  const W=340,H=150,pl=34,pr=10,pt=12,pb=22;
  const vals=ws.map(w=>w.kg); let mn=Math.min(...vals), mx=Math.max(...vals); if(mx-mn<1){mn-=0.5;mx+=0.5} const padv=(mx-mn)*0.15; mn-=padv; mx+=padv;
  const t0=parseKey(ws[0].date).getTime(), t1=parseKey(ws[ws.length-1].date).getTime()||t0+1;
  const x=(d)=>pl+(W-pl-pr)*((parseKey(d).getTime()-t0)/Math.max(1,t1-t0)); const y=(v)=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("weightTrend"))}" style="direction:ltr">`;
  [mn,(mn+mx)/2,mx].forEach(v=>{ s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="0.6"/><text x="${pl-4}" y="${y(v)+3}" text-anchor="end">${v.toFixed(1)}</text>` });
  const pts=ws.map(w=>`${x(w.date).toFixed(1)},${y(w.kg).toFixed(1)}`).join(" ");
  s+=`<polygon points="${x(ws[0].date).toFixed(1)},${H-pb} ${pts} ${x(ws[ws.length-1].date).toFixed(1)},${H-pb}" fill="var(--accent)" opacity="0.12"/>`;
  s+=`<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;

  s+=`<text x="${pl}" y="${H-7}">${ws[0].date.slice(5)}</text><text x="${W-pr}" y="${H-7}" text-anchor="end">${ws[ws.length-1].date.slice(5)}</text>`;
  return s+`</svg>`;
}

  return `<div><div class="muted small" style="margin-bottom:4px">${esc(t("per100"))}</div><div class="manual">${f.map(([k,l],i)=>`<label>${esc(l)}<input id="${prefix}_${k}" data-nut="${k}" type="number" step="any" min="0" inputmode="decimal" value="${per[k]??""}" ${i<4?"required":""}></label>`).join("")}</div></div>`;

let ED=null; // draft
function newDraft(extra){
  const now=Date.now();
  return Object.assign({id:null,items:[],cat:catForHour(new Date().getHours()),ts:now,method:null,oil:null,oilType:"olive_oil",ai:false,conf:null,summary:null,questions:[],photoFull:null,thumb:null,hash:null,hasPhoto:false,likelyFat:false,notes:"",answers:{},dupOf:null,dupOK:false},extra||{});
}
function aiItem(x){
  const g=Math.max(1,+x.grams||0); const lo=+x.grams_low||g*0.8, hi=+x.grams_high||g*1.25;
  const key = (x.key && foodByKey(x.key)) ? x.key : null;
  const est = key? null : validPer(x.est_per100);
  return {uid:uid(),key,name_ar:x.name_ar||x.name_en||"",name_en:x.name_en||x.name_ar||"",grams:Math.round(g),loR:Math.min(1,lo/g),hiR:Math.max(1,hi/g),conf:["high","medium","low"].includes(x.confidence)?x.confidence:"medium",note:LANG==="ar"?(x.note_ar||x.note_en||""):(x.note_en||x.note_ar||""),per:est,est,estimated:!!est,usdaQ:key?null:(x.usda_query||x.name_en||"")};
}
function foodItem(f,grams){ return {uid:uid(),key:f.key,name_ar:f.ar,name_en:f.en,grams:grams||100,loR:1,hiR:1,conf:null,note:"",per:null} }

function draftRange(){
  let lo=0,hi=0;
  ED.items.forEach(it=>{ if(!itemComplete(it)) return; const k=itemVals(it).kcal||0; lo+=k*(it.loR||1); hi+=k*(it.hiR||1); });
  const fatty = ["fried","sauteed","unknown",null].includes(ED.method) && ED.likelyFat;
  if(ED.ai && ED.oil==null && fatty) hi += OIL_G_PER_TBSP*8.84;
  return {lo,hi};
}
function syncOilItem(){
  ED.items = ED.items.filter(i=>!i.addedOil);
  if(ED.oil>0){ const f=FOOD_BY_KEY[ED.oilType]; ED.items.push({uid:uid(),key:f.key,name_ar:t("addedOil")+" ("+f.ar+")",name_en:"Added "+f.en.toLowerCase(),grams:r1(ED.oil*OIL_G_PER_TBSP),loR:1,hiR:1,conf:null,note:"",per:null,addedOil:true}); }
}

function openSheet(html){ let sh=$(".sheet"); if(!sh){ $("#sheetRoot").innerHTML=`<div class="sheet enter" role="dialog" aria-modal="true"></div>`; sh=$(".sheet"); } sh.innerHTML=html; document.body.style.overflow="hidden"; }
function closeSheet(){ if(ED&&ED.abort) ED.abort.abort(); ED=null; $("#sheetRoot").innerHTML=""; document.body.style.overflow=""; }

async function startPhoto(file){
  if(!file) return;
  ED = newDraft({hasPhoto:true});
  let img;
  try{ img = await loadImg(file); }catch(e){ toast(t("analyzeFail")); ED=null; return; }
  ED.photoFull = resize(img.im,720,0.72,false);
  ED.thumb = resize(img.im,120,0.7,false);
  ED.hash = await hashFile(file);
  const exif = file.lastModified && Math.abs(Date.now()-file.lastModified) < 36*3600e3 ? file.lastModified : Date.now();
  ED.ts = exif; ED.cat = catForHour(new Date(exif).getHours());
  const dup = ED.hash && S.meals.find(m=>m.hash===ED.hash);
  if(dup) ED.dupOf = dup.id;
  if(!S.imgOK){ URL.revokeObjectURL(img.u); renderEditor(); return; }
  const blob = await resize(img.im,1024,0.82,true); URL.revokeObjectURL(img.u);
  ED.retryBlob = blob;
  await runAI();
}
async function runAI(){
  if(!ED||!ED.retryBlob) return;
  ED.aiError=null;
  openSheet(`<div class="in"><div class="hd"><button class="x" type="button" data-act="close" aria-label="${esc(t("cancel"))}">×</button><h2>${esc(t("ai"))}</h2></div>
    <div class="scan"><img class="photo" src="${ED.photoFull}" alt="${esc(t("photoAlt"))}"></div>
    <div class="status" role="status"><span class="spin"></span>${esc(t("analyzing"))}</div>
    <p class="muted small">${esc(t("estimateNote"))}</p>
    <button class="btn" type="button" data-act="manualFromPhoto">${esc(t("manualInstead"))}</button></div>`);
  const ctl = new AbortController(); ED.abort = ctl; const myED=ED;
  try{
    const res = await analyze(ED.retryBlob, ctl.signal, ED.hint);
    if(ED!==myED) return;
    ED.abort=null;
    if(!res || res.is_food===false || !Array.isArray(res.items) || !res.items.length){
      ED.ai=false; ED.aiError=t("notFood"); renderEditor(); return;
    }
    ED.ai=true; ED.items=res.items.map(aiItem);
    ED.method = Object.keys(T.ar.methods).includes(res.cooking_method)? res.cooking_method : null;
    if(ED.method==="unknown") ED.method=null;
    ED.likelyFat=!!res.likely_added_fat;
    ED.conf=["high","medium","low"].includes(res.overall_confidence)?res.overall_confidence:"medium";
    ED.summary={ar:(res.dish_ar?res.dish_ar+" — ":"")+(res.summary_ar||""),en:(res.dish_en?res.dish_en+" — ":"")+(res.summary_en||"")};
    ED.questions=(res.questions||[]).slice(0,2);
    ED.retryFailed=false;
    ED.resolving = ED.items.some(it=>!it.key);
    renderEditor();
    if(ED.resolving){ await resolveUnknown(ED.items); if(ED!==myED) return; ED.resolving=false; readManualInputs(); renderEditor(); }
  }catch(e){
    if(ED!==myED) return;
    if(e && (e.code==="cancelled"||e.name==="AbortError")) return;
    ED.abort=null; ED.ai=false; ED.retryFailed=true;
    ED.aiError = t("analyzeFail") + aiErrMsg(e);
    renderEditor();
  }
}

/* ---- manual picker: group → food → quantity + unit ---- */
function pickState(){
  if(!ED.pick) ED.pick={group:"",key:"",qty:1,unit:"g"};
  return ED.pick;
}
function pickGrams(pk){ if(!pk.key) return 0; const u=portionsFor(pk.key).find(p=>p[0]===pk.unit)||["g",1]; return (+pk.qty||0)*u[1]; }
function pickerInner(){
  const pk=pickState(); const L=LANG;
  const groups=Object.keys(GROUPS).concat(S.foods.length?["custom"]:[]);
  const foods = pk.group==="custom" ? S.foods.map(c=>foodByKey("c_"+c.id)) : (GROUPS[pk.group]||[]).map(k=>FOOD_BY_KEY[k]);
  const units = pk.key? portionsFor(pk.key) : [];
  const g = pickGrams(pk); const f=foodByKey(pk.key);
  const pv = (f && g>0) ? `= <b class="num">${fmt1(g)} ${t("g")}</b> · <span class="num">${fmt(f.per.kcal*g/100)} ${t("kcal")} · ${fmt1(f.per.p*g/100)} ${t("g")} ${esc(t("protein"))}</span>` : "";
  return `<h3>${esc(L==="ar"?"أضف مكوّنًا بالاختيار":"Add a component")}</h3>
  <div class="field"><label for="pkGroup">${L==="ar"?"المجموعة":"Food group"}</label><select id="pkGroup"><option value="">${L==="ar"?"اختر المجموعة…":"Choose a group…"}</option>${groups.map(k=>`<option value="${k}" ${pk.group===k?"selected":""}>${esc(GROUP_NAMES[L][k])}</option>`).join("")}</select></div>
  <div class="field"><label for="pkFood">${L==="ar"?"الصنف":"Food"}</label><select id="pkFood" ${pk.group?"":"disabled"}><option value="">${L==="ar"?"اختر الصنف…":"Choose a food…"}</option>${foods.map(x=>`<option value="${x.key}" ${pk.key===x.key?"selected":""}>${esc(fname(x))}</option>`).join("")}</select></div>
  <div class="grid2"><div class="field"><label for="pkQty">${L==="ar"?"الكمية":"Quantity"}</label><input id="pkQty" type="number" inputmode="decimal" min="0" step="any" value="${pk.qty}" ${pk.key?"":"disabled"}></div>
  <div class="field"><label for="pkUnit">${L==="ar"?"الوحدة":"Unit"}</label><select id="pkUnit" ${pk.key?"":"disabled"}>${units.map(([u,gr])=>`<option value="${u}" ${pk.unit===u?"selected":""}>${esc(UNIT_NAMES[L][u])}${u==="g"?"":` (${gr} ${t("g")})`}</option>`).join("")}</select></div></div>
  <div class="row-b"><span class="small muted" id="pkPrev">${pv}</span><button class="btn primary sm" type="button" data-act="pkAdd" ${(pk.key&&g>0)?"":"disabled"}>${esc(t("add"))}</button></div>`;
}
function refreshPicker(){ const el=$("#picker"); if(el) el.innerHTML=pickerInner(); }

function searchFoods(q){
  q=q.trim().toLowerCase(); if(!q) return [];
  return allFoods().filter(f=>(f.ar+" "+f.en+" "+f.key).toLowerCase().includes(q)).slice(0,12);
}
function resultsHTML(list,act){ return list.map(f=>`<button type="button" data-act="${act}" data-key="${f.key}"><span>${esc(fname(f))}</span><span class="num">${fmt(f.per.kcal)} ${t("kcal")} · ${fmt1(f.per.p)}${t("g")} P</span></button>`).join("") }

async function commitMeal(){
  const err=$("#edErr"); const show=(m)=>{err.textContent=m;err.hidden=false;err.scrollIntoView({block:"center"})};
  readManualInputs();
  if(!ED.items.length) return show(t("noItems"));
  if(ED.items.some(i=>!itemComplete(i))) return show(t("fixMissing"));
  const tsIn=$("#edTime").value; const ts= tsIn? new Date(tsIn).getTime() : ED.ts;
  const cat=$("#edCat").value;
  // duplicate guard for non-photo meals
  if(!ED.id && !ED.hasPhoto && !ED.dupOK){
    const sig=ED.items.map(i=>i.key+":"+Math.round(i.grams)).sort().join("|");
    const recent=S.meals.find(m=>Math.abs(m.createdAt-Date.now())<5*60e3 && m.items.map(i=>i.key+":"+Math.round(i.grams)).sort().join("|")===sig);
    if(recent){ ED.dupOK=true; return show(t("dupRecent")); }
  }
  const btn=$("#saveBtn"); if(btn.disabled) return; btn.disabled=true; btn.textContent=t("saving");
  const tot=sumItems(ED.items); const rg=draftRange();
  const items=ED.items.map(i=>{const o={key:i.key,name_ar:i.name_ar,name_en:i.name_en,grams:r1(+i.grams),loR:i.loR||1,hiR:i.hiR||1}; if(i.usda){o.usda=i.usda; if(i.usdaName)o.usdaName=i.usdaName;} if(i.estimated)o.estimated=true; if(i.conf)o.conf=i.conf; if(i.addedOil)o.addedOil=true; if(!i.key&&i.per)o.per=i.per; return o});
  const prev = ED.id ? S.meals.find(m=>m.id===ED.id) : null;
  const m={id:ED.id||uid(),ts,date:dkey(new Date(ts)),cat,items,totals:tot,range:ED.ai?{lo:r0(rg.lo),hi:r0(rg.hi)}:(prev&&prev.range)||null,
    ai:!!(ED.ai||(prev&&prev.ai)),conf:ED.conf||(prev&&prev.conf)||null,hash:ED.hash||(prev&&prev.hash)||null,hasPhoto:!!ED.hasPhoto,thumb:ED.thumb||(prev&&prev.thumb)||null,
    method:ED.method||null,createdAt:prev?prev.createdAt:Date.now(),updatedAt:Date.now()};
  try{
    await saveMeal(m, (!prev && ED.photoFull)? ED.photoFull : null);
    const wasEdit=!!prev; closeSheet(); S.day=m.date; if(S.tab!=="report") S.tab="today"; renderAll(); if(!(await obAfterMealSaved())) toast(wasEdit?t("updated"):t("saved"));
  }catch(e){ btn.disabled=false; btn.textContent=t("save"); show((e&&e.message)||"Error"); }
}
function readManualInputs(){
  if(!ED) return;
  ED.items.forEach(it=>{
    if(it.key && foodByKey(it.key)) return;
    const inputs=document.querySelectorAll(`[id^="m_${it.uid}_"]`); if(!inputs.length) return;
    const per={}; let any=false; inputs.forEach(inp=>{ const v=inp.value.trim(); per[inp.dataset.nut]= v===""?null:+v; if(v!=="") any=true; });
    it.per = any? per : null;
  });
}

/* ============ reuse sheet ============ */
function openReuse(){
  const seen=new Set(); const list=[];
  [...S.meals].sort((a,b)=>b.ts-a.ts).forEach(m=>{ const sig=m.items.map(i=>(i.key||i.name_en)+":"+Math.round(i.grams)).sort().join("|"); if(seen.has(sig)) return; seen.add(sig); list.push(m); });
  openSheet(`<div class="in"><div class="hd"><button class="x" type="button" data-act="close" aria-label="${esc(t("cancel"))}">×</button><h2>${esc(t("reuseTitle"))}</h2></div>
  ${list.length? `<div class="meals">${list.slice(0,40).map(m=>`<div class="meal" style="grid-template-columns:56px 1fr auto">${m.thumb?`<img class="thumb" src="${m.thumb}" alt="">`:`<span class="thumb">✎</span>`}<span class="t"><span class="n" style="display:block">${esc(mealName(m))}</span><span class="m num">${fmt(m.totals.kcal)} ${t("kcal")} · ${fmt(m.totals.p)}${t("g")} P · ${esc(m.date)}</span></span><button class="btn sm primary" type="button" data-act="reuseOne" data-id="${m.id}">${esc(t("use"))}</button></div>`).join("")}</div>` : `<div class="empty">${esc(t("reuseEmpty"))}</div>`}</div>`);
}

/* ============ PDF (canvas-drawn so Arabic shaping is native) ============ */
async function exportPdf(k){
  const btn=document.querySelector('[data-act="pdf"]'); if(btn){btn.disabled=true;btn.textContent=t("exporting")}
  try{
    await document.fonts.ready;
    const W=1240,H=1754,M=90; const pages=[]; let c,x,y;
    const rtl=LANG==="ar"; const ff='"IBM Plex Sans Arabic", "Readex Pro", sans-serif';
    const newPage=()=>{ c=document.createElement("canvas"); c.width=W; c.height=H; x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,W,H); x.direction=rtl?"rtl":"ltr"; pages.push(c); y=M; };
    const need=(h)=>{ if(y+h>H-M) newPage(); };
    const txt=(s,px,opt={})=>{ x.font=`${opt.w||400} ${opt.size||26}px ${ff}`; x.fillStyle=opt.color||"#111821"; x.textAlign=opt.align||(rtl?"right":"left"); x.fillText(String(s),px,y); };
    const startX = rtl? W-M : M; const endX = rtl? M : W-M;
    const wrap=(s,size,maxW)=>{ x.font=`400 ${size}px ${ff}`; const words=String(s).split(" "); const lines=[]; let cur=""; words.forEach(w=>{ const tryS=cur?cur+" "+w:w; if(x.measureText(tryS).width>maxW && cur){lines.push(cur);cur=w}else cur=tryS }); if(cur)lines.push(cur); return lines; };
    newPage();
    const tg=targets(), tot=dayTotals(k), ms=dayMeals(k);
    y+=10; txt(t("pdfTitle"),startX,{size:44,w:600}); y+=48;
    txt(`${dateLabel(k)} · ${k}`,startX,{size:26,color:"#5A6573"}); y+=24;
    x.fillStyle="#1F4FD8"; x.fillRect(M,y,W-2*M,4); y+=56;
    // totals table
    txt(t("pdfTotals"),startX,{size:32,w:600}); y+=46;
    const cols = rtl? [W-M, W-M-420, W-M-640, W-M-860] : [M, M+420, M+640, M+860];
    const al = rtl? "right":"left";
    txt("",cols[0]); txt(t("consumed"),cols[1],{size:22,color:"#5A6573",align:al}); txt(t("target"),cols[2],{size:22,color:"#5A6573",align:al}); txt(t("diff"),cols[3],{size:22,color:"#5A6573",align:al}); y+=14;
    x.fillStyle="#D3DAE3"; x.fillRect(M,y,W-2*M,2); y+=40;
    const rows=[[t("kcalLong"),tot.kcal,tg&&tg.kcal,t("kcal")],[t("protein"),tot.p,tg&&tg.p,t("g")],[t("carbs"),tot.c,tg&&tg.c,t("g")],[t("fat"),tot.f,tg&&tg.f,t("g")],[t("fib"),tot.fib,tg&&tg.fib,t("g")],[t("sat"),tot.sat,null,t("g")],[t("sug"),tot.sug,null,t("g")],[t("na"),tot.na,2300,t("mg")]];
    rows.forEach(([l,v,tv,u])=>{ txt(l,cols[0],{size:25}); txt(`${fmt(v)} ${u}`,cols[1],{size:25,w:600,align:al}); txt(tv?`${fmt(tv)} ${u}`:"—",cols[2],{size:25,align:al});
      if(tv){ const d=v-tv; txt(`${d>=0?"+":"−"}${fmt(Math.abs(d))}`,cols[3],{size:25,align:al,color: Math.abs(d)<=tv*0.1?"#24804F":(d<0?"#B86A10":"#C2342D")}); }
      y+=42; });
    y+=20;
    // tips
    need(120); txt(t("tipsTitle"),startX,{size:32,w:600}); y+=46;
    buildTips(k).forEach(([c,s])=>{ const lines=wrap("• "+s,25,W-2*M); need(lines.length*38+10); lines.forEach(l=>{ txt(l,startX,{size:25,color:c==="w"?"#8a4d08":"#111821"}); y+=38; }); y+=6; });
    y+=20;
    // meals
    need(100); txt(t("pdfMealsH"),startX,{size:32,w:600}); y+=50;
    const mc = rtl? [W-M, W-M-560, W-M-720, W-M-860, W-M-980] : [M, M+560, M+720, M+860, M+980];
    ms.forEach(m=>{
      need(140+m.items.length*38);
      x.fillStyle="#EEF1F4"; x.fillRect(M,y-34,W-2*M,50); txt(`${t("cats")[m.cat]} · ${timeLabel(m.ts)}`,startX + (rtl?-16:16),{size:26,w:600}); txt(`${fmt(m.totals.kcal)} ${t("kcal")} · ${fmt(m.totals.p)}${t("g")} ${t("protein")}`,endX + (rtl?16:-16),{size:24,align:rtl?"left":"right"}); y+=54;
      [t("item"),t("weightCol"),t("kcal"),"P","C / F"].forEach((h,i)=>txt(h,mc[i],{size:20,color:"#5A6573",align:al})); y+=34;
      m.items.forEach(it=>{ const v=itemVals(it); const nm=LANG==="ar"?(it.name_ar||it.name_en):(it.name_en||it.name_ar);
        x.font=`400 24px ${ff}`; let s=nm; while(x.measureText(s).width>520 && s.length>4) s=s.slice(0,-2); if(s!==nm) s+="…";
        txt(s,mc[0],{size:24}); txt(`${fmt(it.grams)} ${t("g")}`,mc[1],{size:24,align:al}); txt(fmt(v.kcal),mc[2],{size:24,align:al}); txt(fmt1(v.p),mc[3],{size:24,align:al}); txt(`${fmt1(v.c)} / ${fmt1(v.f)}`,mc[4],{size:24,align:al}); y+=36; });
      if(m.range){ txt(`${t("range")}: ${fmt(m.range.lo)}–${fmt(m.range.hi)} ${t("kcal")}`,startX,{size:20,color:"#5A6573"}); y+=30; }
      y+=24;
    });
    need(60); y=Math.max(y,H-M-10); txt(t("srcLine"),startX,{size:18,color:"#5A6573"});
    const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:"pt",format:"a4"});
    pages.forEach((p,i)=>{ if(i) pdf.addPage(); pdf.addImage(p.toDataURL("image/jpeg",0.92),"JPEG",0,0,595.28,841.89); });
    const blob=pdf.output("blob");
    await deliverFile(blob,`protivue-report-${k}.pdf`);
  }catch(e){ if(e&&e.code!=="declined") toast((e&&e.message)||"PDF error"); }
  finally{ if(btn){btn.disabled=false;btn.textContent=t("exportPdf")} }
}

async function reanalyze(){
  document.querySelectorAll("[data-ans]").forEach(i=>ED.answers[+i.dataset.ans]=i.value.trim());
  const ans = ED.questions.map((q,i)=>ED.answers[i]?`Q: ${q.text_en}\nA: ${ED.answers[i]}`:"").filter(Boolean).join("\n");
  if(!ans || !ED.photoFull) return;
  const btn=document.querySelector('[data-act="reanalyze"]'); btn.disabled=true; btn.textContent=t("analyzing");
  try{
    const blob = await (await fetch(ED.photoFull)).blob();
    const prev = JSON.stringify(ED.items.map(i=>({key:i.key,name_en:i.name_en,grams:i.grams})));
    const res = await geminiJSON(buildPrompt(`\nRE-ESTIMATE using the user's answers. Current component list (grams may be user-edited): ${prev}\nUser answers:\n${ans}\nReturn questions as an empty array.\n`),blob);
    if(res && Array.isArray(res.items) && res.items.length){
      const oilItem=ED.items.find(i=>i.addedOil);
      ED.items=res.items.map(aiItem); if(oilItem) ED.items.push(oilItem);
      ED.conf=["high","medium","low"].includes(res.overall_confidence)?res.overall_confidence:ED.conf;
      if(res.summary_ar||res.summary_en) ED.summary={ar:res.summary_ar||"",en:res.summary_en||""};
      ED.questions=[]; ED.answers={};
      await resolveUnknown(ED.items);
    }
    renderEditor();
  }catch(e){ btn.disabled=false; btn.textContent=t("analyzeFail"); }
}

document.addEventListener("keydown",(e)=>{
  if(!OB.open) return; const r=e.target.closest && e.target.closest('#obRoot [role="radio"]'); if(!r) return;
  const keys=LANG==="ar"?{ArrowLeft:1,ArrowRight:-1,ArrowDown:1,ArrowUp:-1}:{ArrowLeft:-1,ArrowRight:1,ArrowDown:1,ArrowUp:-1};
  if(!(e.key in keys)) return; e.preventDefault();
  const all=[...r.closest('[role="radiogroup"]').querySelectorAll('[role="radio"]')]; const i=all.indexOf(r); const n=all[(i+keys[e.key]+all.length)%all.length]; n.click();
});
document.addEventListener("input",(e)=>{
  const k=e.target.dataset && e.target.dataset.obf; if(!k||!OB.open) return;
  OB.draft[k]=e.target.value;
  if(OB.errors[k]) obRefreshField(k);
  const sum=$("#obSum"); if(sum) sum.outerHTML=obSummaryHTML();
});
document.addEventListener("change",(e)=>{ const k=e.target.dataset && e.target.dataset.obf; if(!k||!OB.open) return; OB.draft[k]=e.target.value; if(k!=="name"&&k!=="activity") obRefreshField(k); const sum=$("#obSum"); if(sum) sum.outerHTML=obSummaryHTML(); });
document.addEventListener("focusout",(e)=>{ const k=e.target.dataset && e.target.dataset.obf; if(!k||!OB.open||k==="name"||k==="activity") return; if(String(OB.draft[k]||"").trim()!=="") obRefreshField(k); });
/* Called after any meal is saved: finishes onboarding if it was waiting for the first meal. */
async function obAfterMealSaved(){
  if(!OB.open || !OB.awaitingMeal) return false;
  OB.state.done=true; await saveOB(); closeOB(); S.tab="today"; renderAll(); toast(ob("firstMeal")); return true;
}

/* ============ boot ============ */
$("#bkInput").addEventListener("change",async e=>{ const f=e.target.files[0]; if(!f) return; try{ await importBackup(f); toast(LANG==="ar"?"استُوردت النسخة":"Backup imported"); }catch(err){ toast(err.message); } });
renderAll();
(async function boot(){
  try{
    await IDB.open(); S.persist=true;
    const [meals,foods,weights,prof,cfg,obs]=await Promise.all([IDB.all("meals"),IDB.all("foods"),IDB.all("weights"),IDB.get("kv","profile"),IDB.get("kv","cfg"),IDB.get("kv","onboard")]);
    if(obs&&obs.v) OB.state=Object.assign(OB.state,obs.v);
    S.meals=meals||[]; S.foods=foods||[]; S.weights=weights||[]; S.profile=prof?prof.v:null; if(cfg) S.cfg=Object.assign(S.cfg,cfg.v); if(S.cfg.model==="gemini-flash-latest") S.cfg.model=DEFAULT_MODEL;
    try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  }catch(e){ S.persist=false; }
  S.imgOK=!!S.cfg.geminiKey; S.ready=true; renderAll();
  if(profileComplete(S.profile) && !OB.state.done){ OB.state.done=true; saveOB(); }   // existing users go straight in
  if(!profileComplete(S.profile) && !OB.state.done && !OB.state.explored) openOB(1);
  if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
})();
</script>
</body>
